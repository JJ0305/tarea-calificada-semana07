<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Task University</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="d-flex bg-light min-vh-100">

<!-- Sidebar -->
<div class="d-flex flex-column flex-shrink-0 p-3 bg-white border-end" style="width: 260px;">
    <div class="text-center mb-4 mt-2">
        <i class="bi bi-mortarboard-fill text-primary" style="font-size: 2.5rem;"></i>
        <h5 class="fw-bold mt-2 text-dark">Task University</h5>
    </div>
    <ul class="nav nav-pills flex-column mb-auto gap-1">
        <li class="nav-item">
            <a th:href="@{/home}" class="nav-link active bg-primary bg-opacity-10 text-primary px-3 py-2 rounded-3 fw-bold">
                <i class="bi bi-speedometer2 me-2 fs-5 align-middle"></i> Dashboard
            </a>
        </li>
        <!-- El menú Usuarios solo será visible para Docentes -->
        <li class="nav-item" th:if="${rol == 'DOCENTE'}">
            <a th:href="@{/usuarios}" class="nav-link link-dark px-3 py-2 rounded-3 fw-medium">
                <i class="bi bi-people me-2 fs-5 align-middle"></i> Usuarios
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/tareas}" class="nav-link link-dark px-3 py-2 rounded-3 fw-medium">
                <i class="bi bi-card-checklist me-2 fs-5 align-middle"></i> Tareas
            </a>
        </li>
    </ul>
    <div class="mt-4 pt-3 border-top">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-light w-100 text-start text-danger fw-semibold rounded-3">
                <i class="bi bi-box-arrow-left me-2"></i> Cerrar sesión
            </button>
        </form>
    </div>
</div>

<!-- Main Content -->
<div class="flex-grow-1 d-flex flex-column w-100">
    <!-- Navbar -->
    <header class="d-flex justify-content-end align-items-center px-4 py-3 bg-white border-bottom">
        <div class="d-flex align-items-center gap-3">
            <i class="bi bi-bell fs-5 text-muted"></i>
            <div class="d-flex align-items-center gap-2">
                <div class="bg-primary text-white rounded-circle d-flex justify-content-center align-items-center shadow-sm" style="width: 35px; height: 35px;">
                    <i class="bi bi-person"></i>
                </div>
                <div class="d-flex flex-column lh-1">
                    <span class="fw-bold text-dark" style="font-size: 0.9rem;" th:text="${correo}"></span>
                    <small class="text-secondary text-uppercase" style="font-size: 0.70rem;" th:text="${rol}"></small>
                </div>
            </div>
        </div>
    </header>

    <!-- Page Content -->
    <main class="container-fluid p-4 p-md-5">
        <h4 class="fw-bold mb-4">Resumen de Actividad</h4>
        
        <div class="row g-4">

            <div class="col-sm-6 col-lg-3" th:if="${rol == 'DOCENTE'}">
                <div class="card border-0 shadow-sm rounded-4 p-4 h-100">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h6 class="text-muted fw-semibold mb-1 text-uppercase" style="font-size: 0.8rem;">Directorio</h6>
                            <h3 class="fw-bold text-dark mb-0">Usuarios</h3>
                        </div>
                        <div class="bg-dark bg-opacity-10 text-dark rounded-3 p-3 d-flex align-items-center justify-content-center">
                            <i class="bi bi-people fs-4 lh-1"></i>
                        </div>
                    </div>
                    <div class="mt-4 pt-3 border-top">
                        <a th:href="@{/usuarios}" class="text-decoration-none fw-semibold text-dark small">Gestionar accesos <i class="bi bi-arrow-right ms-1"></i></a>
                    </div>
                </div>
            </div>

            <div class="col-sm-6 col-lg-3">
                <div class="card border-0 shadow-sm rounded-4 p-4 h-100">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h6 class="text-muted fw-semibold mb-1 text-uppercase" style="font-size: 0.8rem;">Total Tareas</h6>
                            <h3 class="fw-bold text-primary mb-0" th:text="${totalTareas}">0</h3>
                        </div>
                        <div class="bg-primary bg-opacity-10 text-primary rounded-3 p-3 d-flex align-items-center justify-content-center">
                            <i class="bi bi-journal-text fs-4 lh-1"></i>
                        </div>
                    </div>
                    <div class="mt-4 pt-3 border-top">
                        <a th:href="@{/tareas}" class="text-decoration-none fw-semibold text-primary small">Ver todas <i class="bi bi-arrow-right ms-1"></i></a>
                    </div>
                </div>
            </div>

            <div class="col-sm-6 col-lg-3">
                <div class="card border-0 shadow-sm rounded-4 p-4 h-100">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h6 class="text-muted fw-semibold mb-1 text-uppercase" style="font-size: 0.8rem;">Pendientes</h6>
                            <h3 class="fw-bold text-warning mb-0" th:text="${tareasPendientes}">0</h3>
                        </div>
                        <div class="bg-warning bg-opacity-10 text-warning rounded-3 p-3 d-flex align-items-center justify-content-center">
                            <i class="bi bi-hourglass-split fs-4 lh-1"></i>
                        </div>
                    </div>
                    <div class="mt-4 pt-3 border-top">
                        <span class="text-muted small fw-medium">Requieren tu atención</span>
                    </div>
                </div>
            </div>

            <div class="col-sm-6 col-lg-3">
                <div class="card border-0 shadow-sm rounded-4 p-4 h-100">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h6 class="text-muted fw-semibold mb-1 text-uppercase" style="font-size: 0.8rem;">Completadas</h6>
                            <h3 class="fw-bold text-success mb-0" th:text="${tareasCompletadas}">0</h3>
                        </div>
                        <div class="bg-success bg-opacity-10 text-success rounded-3 p-3 d-flex align-items-center justify-content-center">
                            <i class="bi bi-check2-circle fs-4 lh-1"></i>
                        </div>
                    </div>
                    <div class="mt-4 pt-3 border-top">
                        <span class="text-muted small fw-medium">Actividades finalizadas</span>
                    </div>
                </div>
            </div>

        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
