<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Task University</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; overflow-x: hidden; }
        .sidebar { width: 250px; min-height: 100vh; background-color: #fff; border-right: 1px solid #e9ecef; }
        .nav-link { color: #555; font-weight: 500; padding: 12px 20px; border-radius: 8px; margin: 4px 15px; }
        .nav-link:hover, .nav-link.active { background-color: #f0f4ff; color: #0d6efd; }
        .nav-link i { margin-right: 10px; font-size: 1.1rem; }
        .main-content { flex: 1; }
        .top-navbar { background-color: #fff; height: 70px; border-bottom: 1px solid #e9ecef; }
        .stat-card { border: none; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-3px); }
    </style>
</head>
<body class="d-flex">

<!-- Sidebar -->
<div class="sidebar d-flex flex-column py-3">
    <div class="text-center mb-4 px-3">
        <i class="bi bi-mortarboard-fill text-primary" style="font-size: 2.5rem;"></i>
        <h5 class="fw-bold mt-2 text-dark">Task University</h5>
    </div>
    <ul class="nav flex-column mb-auto">
        <li class="nav-item">
            <a th:href="@{/home}" class="nav-link active"><i class="bi bi-speedometer2"></i> Dashboard</a>
        </li>
        <li class="nav-item">
            <a th:href="@{/usuarios}" class="nav-link"><i class="bi bi-people"></i> Usuarios</a>
        </li>
        <li class="nav-item">
            <a th:href="@{/tareas}" class="nav-link"><i class="bi bi-card-checklist"></i> Tareas</a>
        </li>
    </ul>
    <div class="px-3 mt-4">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-light w-100 text-start text-danger fw-semibold">
                <i class="bi bi-box-arrow-left me-2"></i> Cerrar sesión
            </button>
        </form>
    </div>
</div>

<!-- Main Content -->
<div class="main-content d-flex flex-column">
    <!-- Navbar -->
    <div class="top-navbar d-flex justify-content-end align-items-center px-4">
        <div class="d-flex align-items-center gap-3">
            <i class="bi bi-bell fs-5 text-muted"></i>
            <div class="d-flex align-items-center gap-2">
                <div class="bg-primary text-white rounded-circle d-flex justify-content-center align-items-center" style="width: 35px; height: 35px;">
                    <i class="bi bi-person"></i>
                </div>
                <div class="d-flex flex-column lh-1">
                    <span class="fw-semibold text-dark fs-6" th:text="${correo}"></span>
                    <small class="text-muted" style="font-size: 0.75rem;" th:text="${rol}"></small>
                </div>
            </div>
        </div>
    </div>

    <!-- Page Content -->
    <div class="container-fluid p-4">
        <h4 class="fw-bold mb-4">Panel Principal</h4>
        
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card stat-card p-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted mb-1">Gestión de Usuarios</h6>
                            <h3 class="fw-bold mb-0">Directorio</h3>
                        </div>
                        <div class="bg-primary bg-opacity-10 text-primary rounded p-3">
                            <i class="bi bi-people fs-3"></i>
                        </div>
                    </div>
                    <a th:href="@{/usuarios}" class="btn btn-outline-primary btn-sm mt-3">Ir a Usuarios</a>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card stat-card p-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted mb-1">Mis Tareas</h6>
                            <h3 class="fw-bold mb-0" th:text="${totalTareas != null ? totalTareas : 'Activas'}"></h3>
                        </div>
                        <div class="bg-warning bg-opacity-10 text-warning rounded p-3">
                            <i class="bi bi-journal-text fs-3"></i>
                        </div>
                    </div>
                    <a th:href="@{/tareas}" class="btn btn-outline-warning btn-sm mt-3">Ir a Tareas</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
