<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estudiantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Estudiantes</h1>
        <a class="btn btn-primary" th:href="@{/estudiantes/nuevo}">Registrar estudiante</a>
    </div>

    <div class="alert alert-success" role="status" th:if="${mensaje}" th:text="${mensaje}"></div>

    <div class="card shadow-sm">
        <div class="card-body text-center text-muted py-5" th:if="${estudiantes.isEmpty()}">
            <p class="mb-3">Aún no hay estudiantes registrados.</p>
            <a class="btn btn-outline-primary" th:href="@{/estudiantes/nuevo}">Registrar el primer estudiante</a>
        </div>

        <div class="table-responsive" th:unless="${estudiantes.isEmpty()}">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Apellidos y nombres</th>
                    <th scope="col">DNI</th>
                    <th scope="col">Correo</th>
                    <th scope="col">Celular</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${estudiantes}">
                    <td th:text="${e.id}"></td>
                    <td th:text="${e.apellidos + ', ' + e.nombres}"></td>
                    <td th:text="${e.dni}"></td>
                    <td th:text="${e.correo}"></td>
                    <td th:text="${e.telefono} ?: '—'"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>
</body>
</html>
