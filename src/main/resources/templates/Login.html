<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Task University</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="card shadow border-0">
                <div class="card-body p-5">

                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-primary">📚 Task University</h3>
                        <p class="text-muted">Inicia sesión con tu correo</p>
                    </div>

                    <div th:if="${errorMsg}" class="alert alert-danger"
                         th:text="${errorMsg}"></div>

                    <div th:if="${logoutMsg}" class="alert alert-success"
                         th:text="${logoutMsg}"></div>

                    <form th:action="@{/login}" method="post">

                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo</label>
                            <input type="email" id="correo" name="correo"
                                   class="form-control" required autofocus
                                   placeholder="nombre@uni.edu">
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" id="password" name="password"
                                   class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Ingresar
                        </button>
                    </form>

                    <hr class="my-4">

                    <p class="text-muted small mb-0 text-center">
                        <strong>Cuentas de prueba:</strong><br>
                        admin@uni.edu / admin123 (ADMIN)<br>
                        juan@uni.edu / juan123 (USER)
                    </p>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
