<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar estudiante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4" style="max-width: 720px;">

    <h1 class="h3 mb-3">Registrar estudiante</h1>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/estudiantes}" th:object="${estudiante}" method="post" novalidate>
                <div class="row g-3">

                    <div class="col-md-6">
                        <label for="nombres" class="form-label">Nombres</label>
                        <input type="text" id="nombres" th:field="*{nombres}" class="form-control"
                               th:classappend="${#fields.hasErrors('nombres')} ? 'is-invalid'"
                               maxlength="60" autofocus>
                        <div class="invalid-feedback" th:errors="*{nombres}"></div>
                    </div>

                    <div class="col-md-6">
                        <label for="apellidos" class="form-label">Apellidos</label>
                        <input type="text" id="apellidos" th:field="*{apellidos}" class="form-control"
                               th:classappend="${#fields.hasErrors('apellidos')} ? 'is-invalid'"
                               maxlength="60">
                        <div class="invalid-feedback" th:errors="*{apellidos}"></div>
                    </div>

                    <div class="col-md-4">
                        <label for="dni" class="form-label">DNI</label>
                        <input type="text" id="dni" th:field="*{dni}" class="form-control"
                               th:classappend="${#fields.hasErrors('dni')} ? 'is-invalid'"
                               inputmode="numeric" maxlength="8">
                        <div class="invalid-feedback" th:errors="*{dni}"></div>
                    </div>

                    <div class="col-md-8">
                        <label for="correo" class="form-label">Correo</label>
                        <input type="email" id="correo" th:field="*{correo}" class="form-control"
                               th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{correo}"></div>
                    </div>

                    <div class="col-md-4">
                        <label for="telefono" class="form-label">Celular <span class="text-muted">(opcional)</span></label>
                        <input type="tel" id="telefono" th:field="*{telefono}" class="form-control"
                               th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'"
                               inputmode="numeric" maxlength="9">
                        <div class="invalid-feedback" th:errors="*{telefono}"></div>
                    </div>

                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">Registrar estudiante</button>
                    <a class="btn btn-outline-secondary" th:href="@{/estudiantes}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

</main>
</body>
</html>
