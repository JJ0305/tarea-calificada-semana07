<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar Usuario - Task University</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="d-flex bg-light min-vh-100">

<!-- Sidebar -->
<div class="d-flex flex-column flex-shrink-0 p-3 bg-white border-end" style="width: 260px;">
    <div class="text-center mb-4 mt-2">
        <i class="bi bi-mortarboard-fill text-primary" style="font-size: 2.5rem;"></i>
        <h5 class="fw-bold mt-2 text-dark">Task University</h5>
    </div>
    
    <ul class="nav nav-pills flex-column mb-auto gap-1">
        <li class="nav-item">
            <a th:href="@{/home}" class="nav-link link-dark px-3 py-2 rounded-3 fw-medium">
                <i class="bi bi-speedometer2 me-2 fs-5 align-middle"></i> Dashboard
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/usuarios}" class="nav-link active bg-primary bg-opacity-10 text-primary px-3 py-2 rounded-3 fw-bold">
                <i class="bi bi-people me-2 fs-5 align-middle"></i> Usuarios
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/tareas}" class="nav-link link-dark px-3 py-2 rounded-3 fw-medium">
                <i class="bi bi-card-checklist me-2 fs-5 align-middle"></i> Tareas
            </a>
        </li>
    </ul>
    
    <div class="mt-4 pt-3 border-top">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-light w-100 text-start text-danger fw-semibold rounded-3">
                <i class="bi bi-box-arrow-left me-2"></i> Cerrar sesión
            </button>
        </form>
    </div>
</div>

<!-- Main Content -->
<div class="flex-grow-1 d-flex flex-column w-100">
    
    <!-- Navbar -->
    <header class="d-flex justify-content-end align-items-center px-4 py-3 bg-white border-bottom">
        <div class="d-flex align-items-center gap-3">
            <i class="bi bi-bell fs-5 text-muted"></i>
            <div class="d-flex align-items-center gap-2">
                <div class="bg-primary text-white rounded-circle d-flex justify-content-center align-items-center shadow-sm" style="width: 35px; height: 35px;">
                    <i class="bi bi-person"></i>
                </div>
                <div class="d-flex flex-column lh-1">
                    <span class="fw-bold text-dark" style="font-size: 0.9rem;" th:text="${correo}"></span>
                    <small class="text-secondary" style="font-size: 0.75rem;" th:text="${rol}"></small>
                </div>
            </div>
        </div>
    </header>

    <!-- Page Content -->
    <main class="container-fluid p-4 p-md-5">
        <div class="row">
            <div class="col-xl-9 col-lg-10 mx-auto">
                
                <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                    <div class="d-flex align-items-center mb-4 pb-3 border-bottom">
                        <div class="bg-primary bg-opacity-10 text-primary rounded p-2 me-3">
                            <i class="bi bi-person-plus fs-4"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold mb-0">Registrar Nuevo Usuario</h4>
                            <p class="text-muted small mb-0">Completa los datos para dar de alta a un usuario en el sistema.</p>
                        </div>
                    </div>

                    <form th:action="@{/usuarios}" th:object="${usuario}" method="post" novalidate>
                        
                        <input type="hidden" th:field="*{id}">

                        <div class="row g-4">
                            
                            <!-- Nombres -->
                            <div class="col-md-6">
                                <label for="nombres" class="form-label fw-semibold text-secondary small text-uppercase">Nombres <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-secondary"></i></span>
                                    <input type="text" id="nombres" th:field="*{nombres}" class="form-control border-start-0 ps-0"
                                           th:classappend="${#fields.hasErrors('nombres')} ? 'is-invalid'"
                                           maxlength="60" autofocus placeholder="Ej: Juan Carlos">
                                    <div class="invalid-feedback" th:errors="*{nombres}"></div>
                                </div>
                            </div>

                            <!-- Apellidos -->
                            <div class="col-md-6">
                                <label for="apellidos" class="form-label fw-semibold text-secondary small text-uppercase">Apellidos <span class="text-danger">*</span></label>
                                <input type="text" id="apellidos" th:field="*{apellidos}" class="form-control"
                                       th:classappend="${#fields.hasErrors('apellidos')} ? 'is-invalid'"
                                       maxlength="60" placeholder="Ej: Pérez Gómez">
                                <div class="invalid-feedback" th:errors="*{apellidos}"></div>
                            </div>

                            <!-- DNI -->
                            <div class="col-md-4">
                                <label for="dni" class="form-label fw-semibold text-secondary small text-uppercase">DNI <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-card-heading text-secondary"></i></span>
                                    <input type="text" id="dni" th:field="*{dni}" class="form-control border-start-0 ps-0"
                                           th:classappend="${#fields.hasErrors('dni')} ? 'is-invalid'"
                                           inputmode="numeric" maxlength="8" placeholder="8 dígitos">
                                    <div class="invalid-feedback" th:errors="*{dni}"></div>
                                </div>
                            </div>

                            <!-- Correo -->
                            <div class="col-md-8">
                                <label for="correo" class="form-label fw-semibold text-secondary small text-uppercase">Correo Electrónico <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-secondary"></i></span>
                                    <input type="email" id="correo" th:field="*{correo}" class="form-control border-start-0 ps-0"
                                           th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid'" placeholder="nombre@correo.com">
                                    <div class="invalid-feedback" th:errors="*{correo}"></div>
                                </div>
                            </div>

                            <!-- Teléfono -->
                            <div class="col-md-4">
                                <label for="telefono" class="form-label fw-semibold text-secondary small text-uppercase">Celular <span class="text-muted fw-normal text-lowercase">(opcional)</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-telephone text-secondary"></i></span>
                                    <input type="tel" id="telefono" th:field="*{telefono}" class="form-control border-start-0 ps-0"
                                           th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'"
                                           inputmode="numeric" maxlength="9" placeholder="9XXXXXXXX">
                                    <div class="invalid-feedback" th:errors="*{telefono}"></div>
                                </div>
                            </div>

                            <!-- Rol (NUEVO CAMPO) -->
                            <div class="col-md-4">
                                <label for="rol" class="form-label fw-semibold text-secondary small text-uppercase">Rol del Sistema <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-check text-secondary"></i></span>
                                    <select id="rol" th:field="*{rol}" class="form-select border-start-0 ps-0">
                                        <option value="ESTUDIANTE">Estudiante</option>
                                        <option value="DOCENTE">Docente</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Contraseña -->
                            <div class="col-md-4">
                                <label for="password" class="form-label fw-semibold text-secondary small text-uppercase">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-secondary"></i></span>
                                    <input type="password" id="password" th:field="*{password}" class="form-control border-start-0 ps-0"
                                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" placeholder="Por defecto: DNI">
                                    <div class="invalid-feedback" th:errors="*{password}"></div>
                                </div>
                            </div>

                        </div>

                        <div class="d-flex justify-content-end gap-3 mt-5 pt-4 border-top">
                            <a th:href="@{/usuarios}" class="btn btn-light fw-bold text-secondary px-4 py-2">Cancelar</a>
                            <button type="submit" class="btn btn-primary fw-bold px-4 py-2 shadow-sm">
                                <i class="bi bi-check-lg me-1"></i> Guardar Usuario
                            </button>
                        </div>
                    </form>
                </div>
                
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
