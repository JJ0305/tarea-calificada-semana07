<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Usuarios</h1>
        <a class="btn btn-primary" th:href="@{/usuarios/nuevo}">Registrar usuario</a>
    </div>

    <div class="alert alert-success" role="status" th:if="${mensaje}" th:text="${mensaje}"></div>

    <div class="card shadow-sm">
        <!-- Verificamos si la lista 'usuarios' está vacía -->
        <div class="card-body text-center text-muted py-5" th:if="${usuarios.isEmpty()}">
            <p class="mb-3">Aún no hay usuarios registrados.</p>
            <a class="btn btn-outline-primary" th:href="@{/usuarios/nuevo}">Registrar el primer usuario</a>
        </div>

        <div class="table-responsive" th:unless="${usuarios.isEmpty()}">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Apellidos y nombres</th>
                    <th scope="col">DNI</th>
                    <th scope="col">Correo</th>
                    <th scope="col">Celular</th>
                </tr>
                </thead>
                <tbody>
                <!-- Iteramos sobre la lista 'usuarios' con la variable 'u' -->
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.usuario_id}"></td>
                    <td th:text="${u.apellidos + ', ' + u.nombres}"></td>
                    <td th:text="${u.dni}"></td>
                    <td th:text="${u.correo}"></td>
                    <td th:text="${u.telefono} ?: '—'"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>
</body>
</html>
